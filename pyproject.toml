[project]
name = "ebpm-claude"
version = "1.0.0a1"
requires-python = ">=3.10"
dependencies = [
    "japanize-matplotlib>=1.1.3",
    "jsonschema>=4.20",
    "markdown>=3.10.3",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-docx>=1.2.0",
    "referencing>=0.30",
    "reportlab>=5.0.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.10",
    "setuptools>=84.0.0",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]

